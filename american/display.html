<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>American Gate Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Text:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/display.css">
</head>
<body>
  <div id="stage">
    <!-- The chrome is one SVG: the header wedge and the bottom band are raked and then turn through a
         curve, which a clip-path polygon cannot do. The rake reads 1619/1663/1667 px across three
         independently rectified photographs, so it is drawn at 1663. -->
    <svg class="chrome" viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#0b7ae0"/>
          <stop offset="0.55" stop-color="#0078d2"/>
          <stop offset="1" stop-color="#0069bb"/>
        </linearGradient>
        <linearGradient id="hdrFill" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#ffffff"/>
          <stop offset="0.45" stop-color="#ffffff"/>
          <stop offset="1" stop-color="#e4eef6"/>
        </linearGradient>
      </defs>
      <rect width="1920" height="1080" fill="url(#field)"/>
      <path d="M0 0 H1663 L1548 176 Q1522 218 1466 218 H0 Z" fill="url(#hdrFill)"/>
      <path d="M0 953 H1180 Q1232 953 1262 913 Q1292 873 1344 873 H1920 V1080 H0 Z" fill="#0a3a91"/>
      <path id="pill" d="M1256 100 H1530 L1504 192 H1256 Z" fill="#127c3a"/>
    </svg>

    <img class="sym" src="assets/aa-flight-symbol.svg" alt="American Airlines">
    <div class="fno" id="fno"></div>
    <div class="dest" id="dest"></div>
    <div class="pill-text" id="pillText"></div>

    <div class="gate-l">Gate</div>
    <div class="gate" id="gate"></div>

    <div class="boards" id="boards"></div>
    <div class="t-label dep-l">Departs</div>
    <div class="t-value dep-v" id="departs"></div>
    <div class="t-label arr-l" id="arrivesLabel">Arrives</div>
    <div class="t-value arr-v" id="arrives"></div>

    <div class="panel" id="panel"></div>

    <img class="ow" src="assets/oneworld.svg" alt="oneworld">
    <div class="dur" id="dur"></div>
    <div class="clock" id="clock"></div>
  </div>
  <div id="err" hidden></div>

  <script src="js/state.js"></script>
  <script src="js/display.js"></script>
</body>
</html>
